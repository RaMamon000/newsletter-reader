name: Meruma
options:
  bundleIdPrefix: com.ramamon
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 64C989L566

targets:
  Meruma:
    type: application
    platform: iOS
    sources:
      - path: Meruma
        excludes: ["Info.plist"]
    info:
      path: Meruma/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramamon.newsletter
        CODE_SIGN_ENTITLEMENTS: Meruma/Meruma.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: メルマガ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
