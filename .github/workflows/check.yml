name: check

on:
  # 過去分の処理が済むまで止めておく（済んだら下の2行を戻す）
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去分を全部処理する（通知なし）"
        type: boolean
        default: false
      limit:
        description: "処理する号数の上限（空なら無制限）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: newsletter-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - name: Run pipeline
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          NEWSLETTER_CONFIG: ${{ secrets.NEWSLETTER_CONFIG }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_DEVICE_TOKEN: ${{ secrets.APNS_DEVICE_TOKEN }}
          IN_BACKFILL: ${{ inputs.backfill }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ "$IN_BACKFILL" = "true" ]; then args+=(--backfill); fi
          if [ -n "$IN_LIMIT" ]; then args+=(--limit "$IN_LIMIT"); fi
          python backend/pipeline.py "${args[@]}"
      - name: Commit data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'data/*.json.enc' 'data/issues/*.json.enc'
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update data"
            git pull --rebase --quiet
            git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
